[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readaloud"
version = "0.1.0"
description = "Offline voice-controlled document reader CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tts", "text-to-speech", "document", "reader", "accessibility", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyttsx3>=2.90",
    "pypdf>=3.0",
    "python-docx>=1.0",
    "odfpy>=1.4",
    "python-pptx>=0.6",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pysbd>=0.3",
    "pynput>=1.7",
    "platformdirs>=4.0",
    "striprtf>=0.0.26",
    "lxml>=5.0",
]

[project.optional-dependencies]
pdf-fast = ["PyMuPDF>=1.23"]
voice = ["vosk>=0.3.45", "sounddevice>=0.4"]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff", "mypy"]
all = ["readaloud[pdf-fast,voice]"]

[project.scripts]
readaloud = "readaloud.cli:main"

[project.urls]
Homepage = "https://github.com/user/readaloud"
Issues = "https://github.com/user/readaloud/issues"

[tool.hatch.build.targets.wheel]
packages = ["readaloud"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
